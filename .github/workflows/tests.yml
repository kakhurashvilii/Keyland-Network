name: Python tests

on:
  push:
    branches: [main, feature/oneplus6t-router-management]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          KEYLAND_JWT_SECRET: test-only-secret-key-never-use-in-production-123456
        run: pytest -q
