name: Python tests

on:
  push:
    branches: [main, feature/oneplus6t-router-management, feature/hotspot-interface-fixes]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          KEYLAND_JWT_SECRET: test-only-secret-key-never-use-in-production-123456
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/keyland-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/keyland-dashboard.js
